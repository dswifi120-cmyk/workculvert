<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkCulvert — Admin</title><link rel="stylesheet" href="workculvert-ui.css"><style>
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button,.btn{display:inline-block;border:0;border-radius:9px;background:#047857;color:white;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:10px}button.secondary{background:#e2e8f0;color:#0f172a}.muted{color:#64748b;font-size:14px}.msg{margin:12px 0;font-size:14px;overflow-wrap:anywhere}header{background:#064e3b;color:white;padding:15px 20px}header a{color:white;margin-right:14px}.item{border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin:8px 0}</style></head><body><header><strong>WorkCulvert</strong> — যেকোনো কাজ, উপযুক্ত কর্মী। <nav style="margin-top:8px"><a href="index.html">হোম</a><a href="worker-dashboard.html">Worker</a><a href="employer-profile.html">Employer</a><a href="auth.html">লগইন</a></nav></header><main class="wrap"><h1>Admin Operations</h1><p class="muted">এই পেজে প্রবেশের আগে Firebase Authentication এবং users/{UID}/role যাচাই হয়।</p><div id="msg" class="msg"></div><section class="card"><h2>সারসংক্ষেপ</h2><div class="grid"><div class="item">ব্যবহারকারী: <strong id="usersCount">—</strong></div><div class="item">কাজ: <strong id="jobsCount">—</strong></div></div></section><section class="card"><h2>ব্যবহারকারী</h2><div id="users">লোড হচ্ছে…</div></section><section class="card"><h2>কাজ</h2><div id="jobs">লোড হচ্ছে…</div></section><button id="logout">লগআউট</button></main><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import {getDatabase,ref,get} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig = {
 apiKey: "AIzaSyDUgBWJZ_-61qoifMqiuVaXHULtF1Dma2I",
 authDomain: "workculvert-web.firebaseapp.com",
 databaseURL: "https://workculvert-web-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "workculvert-web",
 storageBucket: "workculvert-web.firebasestorage.app",
 messagingSenderId: "968194354431",
 appId: "1:968194354431:web:20192af00dceee43a830ca"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
onAuthStateChanged(auth,async u=>{if(!u){location.replace('admin-login.html');return;}try{const role=await get(ref(db,'users/'+u.uid+'/role'));if(!role.exists()||role.val()!=='admin'){await signOut(auth);location.replace('admin-login.html');return;}
const us=await get(ref(db,'users'));let ur=[];if(us.exists())us.forEach(c=>ur.push({uid:c.key,...c.val()}));$('usersCount').textContent=ur.length;$('users').innerHTML=ur.map(x=>`<div class="item"><strong>${String(x.email||'')}</strong><div>${String(x.role||'')} · UID: ${String(x.uid)}</div></div>`).join('')||'কোনো ব্যবহারকারী নেই';
const js=await get(ref(db,'jobs'));let jr=[];if(js.exists())js.forEach(c=>jr.push({id:c.key,...c.val()}));$('jobsCount').textContent=jr.length;$('jobs').innerHTML=jr.map(x=>`<div class="item"><strong>${String(x.title||'কাজ')}</strong><div>${String(x.location||'')} · ${String(x.status||'')}</div><small>Employer UID: ${String(x.employerUid||'পুরোনো ডেটা')}</small></div>`).join('')||'কোনো কাজ নেই';
}catch(e){$('msg').textContent='ডেটা পড়া যায়নি। Rules/ডেটা মাইগ্রেশন পরীক্ষা করুন। '+e.message;}});
$('logout').addEventListener('click',()=>signOut(auth).then(()=>location.href='admin-login.html'));
</script></body></html>
