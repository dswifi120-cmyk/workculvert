<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkCulvert — কাজ খুঁজুন</title><style>body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:1000px;margin:24px auto;padding:16px}.card,.item{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}header{background:#064e3b;color:#fff;padding:15px 20px}header a{color:white;margin-right:14px}button{border:0;border-radius:9px;background:#047857;color:white;padding:10px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.muted{color:#64748b;font-size:14px}#msg{overflow-wrap:anywhere}</style></head><body><header><strong>WorkCulvert</strong> — কাজ খুঁজুন<nav style="margin-top:8px"><a href="index.html">হোম</a><a href="worker-dashboard.html">Worker Dashboard</a><a href="employer-profile.html">Employer Dashboard</a></nav></header><main class="wrap"><h1>খোলা কাজ</h1><p class="muted">আবেদন করতে Worker হিসেবে লগইন করুন। প্রতি কাজের জন্য একবার আবেদন করা যাবে।</p><p id="msg"></p><section class="card"><div id="jobs">লোড হচ্ছে…</div></section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{getDatabase,ref,get,set}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
const cfg={apiKey:'AIzaSyDUgBWJZ_-61qoifMqiuVaXHULtF1Dma2I',authDomain:'workculvert-web.firebaseapp.com',databaseURL:'https://workculvert-web-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'workculvert-web',storageBucket:'workculvert-web.firebasestorage.app',messagingSenderId:'968194354431',appId:'1:968194354431:web:20192af00dceee43a830ca'};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);let user=null,role=null,jobs=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(t,ok=false){$('msg').textContent=t;$('msg').style.color=ok?'#047857':'#b91c1c'}
async function render(){try{let [js,as]=await Promise.all([get(ref(db,'jobs')),user?get(ref(db,'applications')):Promise.resolve(null)]);jobs=[];if(js.exists())js.forEach(s=>{let j=s.val();if(j&&j.status==='open')jobs.push({id:s.key,...j})});let applied=new Set();if(as&&as.exists())as.forEach(s=>{if(s.child(user.uid).exists())applied.add(s.key)});$('jobs').innerHTML=jobs.length?jobs.map(j=>`<article class="item"><h3>${esc(j.title||'কাজ')}</h3><p>${esc(j.description||'বিবরণ নেই')}</p><p><b>এলাকা:</b> ${esc(j.location||'উল্লেখ নেই')} · <b>পারিশ্রমিক:</b> ৳${esc(j.pay||0)} · <b>মেয়াদ:</b> ${esc(j.duration||'উল্লেখ নেই')}</p>${user&&role==='worker'?`<button data-apply="${esc(j.id)}" ${applied.has(j.id)?'disabled':''}>${applied.has(j.id)?'আবেদন করা হয়েছে':'আবেদন করুন'}</button>`:`<a href="auth.html">লগইন করে আবেদন করুন</a>`}</article>`).join(''):'এখন কোনো খোলা কাজ নেই।'}catch(e){say('কাজ লোড হয়নি; Firebase Rules পরীক্ষা করুন। '+e.message)}}
$('jobs').addEventListener('click',async e=>{let id=e.target?.dataset?.apply;if(!id)return;if(!user||role!=='worker'){say('Worker হিসেবে লগইন করুন।');return}e.target.disabled=true;try{let target=ref(db,`applications/${id}/${user.uid}`),old=await get(target);if(old.exists())throw Error('এই কাজের জন্য আগে আবেদন করেছেন।');let j=jobs.find(x=>x.id===id);if(!j||j.status!=='open')throw Error('কাজটি আর খোলা নেই।');await set(target,{workerUid:user.uid,jobId:id,employerUid:j.employerUid,status:'submitted',createdAt:Date.now()});say('আবেদন জমা হয়েছে।',true);await render()}catch(err){say('আবেদন হয়নি: '+err.message);e.target.disabled=false}});onAuthStateChanged(auth,async u=>{user=u;role=null;if(u){try{let s=await get(ref(db,'users/'+u.uid));role=s.exists()?s.val().role:null}catch{}}await render()});</script></body></html>
