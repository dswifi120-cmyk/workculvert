<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkCulvert — Employer Dashboard</title><link rel="stylesheet" href="workculvert-ui.css"><style>
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button,.btn{display:inline-block;border:0;border-radius:9px;background:#047857;color:white;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:10px}button.secondary{background:#e2e8f0;color:#0f172a}.muted{color:#64748b;font-size:14px}.msg{margin:12px 0;font-size:14px;overflow-wrap:anywhere}header{background:#064e3b;color:white;padding:15px 20px}header a{color:white;margin-right:14px}.item{border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin:8px 0}</style></head><body><header><strong>WorkCulvert</strong> — যেকোনো কাজ, উপযুক্ত কর্মী। <nav style="margin-top:8px"><a href="index.html">হোম</a><a href="worker-dashboard.html">Worker</a><a href="jobs.html">কাজ খুঁজুন</a><a href="employer-profile.html">Employer</a><a href="employer-applications.html">আবেদন দেখুন</a><a href="auth.html">লগইন</a></nav></header><main class="wrap"><h1>Employer Dashboard</h1><p class="muted">কাজ পোস্ট করতে Employer হিসেবে লগইন থাকতে হবে। Job আপনার Firebase UID-এর মালিকানায় সংরক্ষিত হবে।</p><div id="msg" class="msg"></div><section class="card"><h2>নিয়োগদাতা প্রোফাইল</h2><form id="profileForm"><label>প্রতিষ্ঠান/নিয়োগদাতার নাম</label><input id="name" required maxlength="120"><label>ফোন নম্বর</label><input id="phone" maxlength="25"><label>ঠিকানা/কাজের এলাকা</label><input id="area" maxlength="200"><button>প্রোফাইল সংরক্ষণ</button></form></section><section class="card"><h2>নতুন কাজ পোস্ট করুন</h2><form id="jobForm"><label>কাজের শিরোনাম</label><input id="title" required maxlength="120"><label>কাজের বিবরণ</label><textarea id="description" required rows="4" maxlength="3000"></textarea><div class="grid"><div><label>কাজের এলাকা</label><input id="location" required maxlength="200"></div><div><label>পারিশ্রমিক (৳)</label><input id="pay" type="number" min="0" max="10000000" required></div></div><label>সময়/মেয়াদ</label><input id="duration" required maxlength="120" placeholder="যেমন: ১ দিন"><button>কাজ পোস্ট করুন</button></form></section><section class="card"><h2>আমার পোস্ট করা কাজ</h2><div id="jobs">লোড হচ্ছে…</div></section><button class="secondary" id="logout">লগআউট</button></main><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getDatabase,ref,get,set,update,push,query,orderByChild,equalTo} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig = {
 apiKey: "AIzaSyDUgBWJZ_-61qoifMqiuVaXHULtF1Dma2I",
 authDomain: "workculvert-web.firebaseapp.com",
 databaseURL: "https://workculvert-web-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "workculvert-web",
 storageBucket: "workculvert-web.firebasestorage.app",
 messagingSenderId: "968194354431",
 appId: "1:968194354431:web:20192af00dceee43a830ca"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
const say=(s,ok=false)=>{if($('msg')){$('msg').textContent=s;$('msg').style.color=ok?'#047857':'#b91c1c';}};
async function userRole(user){const s=await get(ref(db,'users/'+user.uid));return s.exists()?s.val().role:null;}
function doLogout(){signOut(auth).then(()=>location.href='auth.html');}

let current;
async function loadJobs(){const s=await get(ref(db,'jobs'));let out=[];if(s.exists())s.forEach(c=>{const j=c.val();if(j.employerUid===current.uid)out.push({id:c.key,...j});});$('jobs').innerHTML=out.length?out.map(j=>`<div class="item"><strong>${String(j.title||'কাজ')}</strong><div>${String(j.location||'')} · ৳${String(j.pay||'0')} · ${String(j.status||'open')}</div></div>`).join(''):'এখনো কোনো কাজ পোস্ট করেননি।';}
onAuthStateChanged(auth,async u=>{if(!u){location.replace('auth.html');return;}try{current=u;const role=await userRole(u);if(role!=='employer'){say('এই পেজটি Employer অ্যাকাউন্টের জন্য।');await signOut(auth);location.replace('auth.html');return;}const s=await get(ref(db,'employers/'+u.uid));if(s.exists()){const d=s.val();['name','phone','area'].forEach(k=>$(k).value=d[k]||'');}await loadJobs();}catch(e){say('ডেটা লোড হয়নি। Firebase Rules ও সংযোগ পরীক্ষা করুন। '+e.message);}});
$('profileForm').addEventListener('submit',async e=>{e.preventDefault();try{const d={uid:current.uid,email:current.email||'',name:$('name').value.trim(),phone:$('phone').value.trim(),area:$('area').value.trim(),updatedAt:Date.now()};await update(ref(db,'employers/'+current.uid),d);say('প্রোফাইল সংরক্ষিত হয়েছে।',true);}catch(e){say('সংরক্ষণ হয়নি। '+e.message);}});
$('jobForm').addEventListener('submit',async e=>{e.preventDefault();try{const j={employerUid:current.uid,title:$('title').value.trim(),description:$('description').value.trim(),location:$('location').value.trim(),pay:Number($('pay').value),duration:$('duration').value.trim(),status:'open',createdAt:Date.now()};const n=push(ref(db,'jobs'));await set(n,j);e.target.reset();say('কাজ পোস্ট হয়েছে।',true);await loadJobs();}catch(e){say('কাজ পোস্ট হয়নি। Rules মাইগ্রেশন প্রয়োজন হতে পারে। '+e.message);}});
$('logout').addEventListener('click',doLogout);
</script></body></html>
