<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkCulvert — আবেদন ব্যবস্থাপনা</title><style>body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:1000px;margin:24px auto;padding:16px}.card,.item{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}header{background:#064e3b;color:white;padding:15px 20px}header a{color:white;margin-right:12px}button{border:0;border-radius:9px;background:#047857;color:white;padding:10px 13px;font-weight:700;cursor:pointer;margin:4px}button:disabled{opacity:.5}.muted{color:#64748b;font-size:14px}#msg{overflow-wrap:anywhere}</style></head><body><header><strong>WorkCulvert</strong> — আবেদন ব্যবস্থাপনা<nav style="margin-top:8px"><a href="index.html">হোম</a><a href="employer-profile.html">Employer Dashboard</a></nav></header><main class="wrap"><h1>আমার কাজের আবেদন</h1><p class="muted">শুধু আপনার পোস্ট করা কাজের আবেদন দেখা যাবে। Worker UID দেখানো হচ্ছে; ব্যক্তিগত তথ্য প্রকাশ করা হচ্ছে না।</p><p id="msg"></p><div id="content">লোড হচ্ছে…</div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{getDatabase,ref,get,update}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';const cfg={apiKey:'AIzaSyDUgBWJZ_-61qoifMqiuVaXHULtF1Dma2I',authDomain:'workculvert-web.firebaseapp.com',databaseURL:'https://workculvert-web-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'workculvert-web',storageBucket:'workculvert-web.firebasestorage.app',messagingSenderId:'968194354431',appId:'1:968194354431:web:20192af00dceee43a830ca'};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);let current=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(t,ok=false){$('msg').textContent=t;$('msg').style.color=ok?'#047857':'#b91c1c'}
async function load(){const [js,as]=await Promise.all([get(ref(db,'jobs')),get(ref(db,'applications'))]);let rows=[];if(js.exists())js.forEach(s=>{let j=s.val();if(j.employerUid===current.uid){let apps=[];let a=as.exists()?as.child(s.key):null;if(a&&a.exists())a.forEach(w=>apps.push({uid:w.key,...w.val()}));rows.push({id:s.key,...j,apps})}});$('content').innerHTML=rows.length?rows.map(j=>`<section class="card"><h2>${esc(j.title||'কাজ')}</h2><p>${esc(j.location||'')} · ৳${esc(j.pay||0)} · <b>${esc(j.status||'open')}</b></p><div class="muted">Job ID: ${esc(j.id)}</div><h3>আবেদন (${j.apps.length})</h3>${j.apps.length?j.apps.map(a=>`<div class="item"><b>Worker UID:</b> ${esc(a.uid)}<p>আবেদনের অবস্থা: ${esc(a.status||'submitted')}</p>${a.status==='submitted'&&j.status==='open'?`<button data-select="${esc(j.id)}|${esc(a.uid)}">Worker নির্বাচন</button>`:''}${a.status==='selected'&&j.selectedWorkerUid===a.uid&&j.status==='assigned'?`<button data-complete="${esc(j.id)}|${esc(a.uid)}">কাজ সম্পন্ন</button>`:''}</div>`).join(''):'এখনো আবেদন নেই।'}</section>`).join(''):'আপনার পোস্ট করা কাজ পাওয়া যায়নি।'}
$('content').addEventListener('click',async e=>{let raw=e.target?.dataset?.select,done=e.target?.dataset?.complete;if(!raw&&!done)return;let [jobId,workerUid]=(raw||done).split('|');e.target.disabled=true;try{let [jr,ar]=[ref(db,'jobs/'+jobId),ref(db,`applications/${jobId}/${workerUid}`)], [js,as]=await Promise.all([get(jr),get(ar)]);if(!js.exists()||js.val().employerUid!==current.uid)throw Error('কাজের মালিকানা যাচাই হয়নি।');if(!as.exists())throw Error('আবেদন পাওয়া যায়নি।');if(raw){if(js.val().status!=='open'||as.val().status!=='submitted')throw Error('এই আবেদন আর নির্বাচনযোগ্য নয়।');await update(ar,{status:'selected',selectedAt:Date.now()});await update(jr,{status:'assigned',selectedWorkerUid:workerUid,updatedAt:Date.now()});say('Worker নির্বাচন করা হয়েছে।',true)}else{if(js.val().status!=='assigned'||js.val().selectedWorkerUid!==workerUid||as.val().status!=='selected')throw Error('নির্বাচিত Worker যাচাই হয়নি।');await update(ar,{status:'completed',completedAt:Date.now()});await update(jr,{status:'completed',completedAt:Date.now(),updatedAt:Date.now()});say('কাজ সম্পন্ন হিসেবে চিহ্নিত হয়েছে।',true)}await load()}catch(err){say('পরিবর্তন হয়নি। Rules বা ডেটা পরীক্ষা করুন: '+err.message);e.target.disabled=false}});
onAuthStateChanged(auth,async u=>{if(!u){location.replace('auth.html');return}try{let s=await get(ref(db,'users/'+u.uid));if(!s.exists()||s.val().role!=='employer'){say('এই পেজ Employer-এর জন্য।');await signOut(auth);location.replace('auth.html');return}current=u;await load()}catch(e){say('ডেটা লোড হয়নি: '+e.message)}});</script></body></html>
