<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkCulvert — Admin Login</title><link rel="stylesheet" href="workculvert-ui.css"><style>
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button,.btn{display:inline-block;border:0;border-radius:9px;background:#047857;color:white;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:10px}button.secondary{background:#e2e8f0;color:#0f172a}.muted{color:#64748b;font-size:14px}.msg{margin:12px 0;font-size:14px;overflow-wrap:anywhere}header{background:#064e3b;color:white;padding:15px 20px}header a{color:white;margin-right:14px}.item{border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin:8px 0}</style></head><body><header><strong>WorkCulvert</strong> — যেকোনো কাজ, উপযুক্ত কর্মী। <nav style="margin-top:8px"><a href="index.html">হোম</a><a href="worker-dashboard.html">Worker</a><a href="employer-profile.html">Employer</a><a href="auth.html">লগইন</a></nav></header><main class="wrap"><section class="card" style="max-width:520px;margin:7vh auto"><h1>Admin Login</h1><p class="muted">শুধু Firebase-এ অনুমোদিত Admin অ্যাকাউন্ট প্রবেশ করতে পারবে।</p><div id="msg" class="msg"></div><form id="login"><label>Admin Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>নিরাপদে লগইন</button></form><p><a href="index.html">হোমপেজ</a></p></section></main><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import {getAuth,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import {getDatabase,ref,get} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig = {
 apiKey: "AIzaSyDUgBWJZ_-61qoifMqiuVaXHULtF1Dma2I",
 authDomain: "workculvert-web.firebaseapp.com",
 databaseURL: "https://workculvert-web-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "workculvert-web",
 storageBucket: "workculvert-web.firebasestorage.app",
 messagingSenderId: "968194354431",
 appId: "1:968194354431:web:20192af00dceee43a830ca"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
$('login').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='যাচাই হচ্ছে…';try{const c=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);const s=await get(ref(db,'users/'+c.user.uid));if(!s.exists()||s.val().role!=='admin'){await signOut(auth);throw new Error('এই অ্যাকাউন্টে Admin অনুমতি নেই।');}location.href='admin.html';}catch(e){$('msg').textContent=e.message||'লগইন ব্যর্থ হয়েছে।';}});
</script></body></html>
