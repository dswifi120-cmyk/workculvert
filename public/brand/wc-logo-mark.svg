<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="wcBg" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#052E27"/>
      <stop offset="55%" stop-color="#0C5B4E"/>
      <stop offset="100%" stop-color="#0A483E"/>
    </linearGradient>
    <linearGradient id="wcGold" x1="120" y1="90" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="wcMint" x1="90" y1="200" x2="290" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <!-- Corporate Rounded Shield Crest -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#wcBg)"/>
  <rect x="34" y="34" width="444" height="444" rx="98" stroke="#6EE7B7" stroke-opacity="0.24" stroke-width="4"/>

  <!-- Signature Golden Culvert Bridge Arch (Connecting People & Work) -->
  <path
    d="M116 184C154 114 218 88 268 88C324 88 378 118 408 176"
    stroke="url(#wcGold)"
    stroke-width="32"
    stroke-linecap="round"
  />
  <!-- Keystone Spark Dot -->
  <circle cx="264" cy="142" r="13" fill="#FBBF24"/>

  <!-- Bold Geometric 'W' Monogram -->
  <path
    d="M86 220L128 386L178 274L228 386L270 220"
    stroke="url(#wcMint)"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Interlocking Bold 'C' Monogram -->
  <path
    d="M412 248C394 226 368 214 338 214C284 214 246 252 246 304C246 356 284 394 338 394C370 394 396 380 414 356"
    stroke="#FBBF24"
    stroke-width="40"
    stroke-linecap="round"
  />

  <!-- Ground Foundation Bar -->
  <rect x="148" y="432" width="216" height="12" rx="6" fill="#6EE7B7" fill-opacity="0.45"/>
</svg>
