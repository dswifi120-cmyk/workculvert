<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkCulvert — Worker Dashboard</title><link rel="stylesheet" href="workculvert-ui.css"><style>
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button,.btn{display:inline-block;border:0;border-radius:9px;background:#047857;color:white;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:10px}button.secondary{background:#e2e8f0;color:#0f172a}.muted{color:#64748b;font-size:14px}.msg{margin:12px 0;font-size:14px;overflow-wrap:anywhere}header{background:#064e3b;color:white;padding:15px 20px}header a{color:white;margin-right:14px}.item{border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin:8px 0}</style></head><body><header><strong>WorkCulvert</strong> — যেকোনো কাজ, উপযুক্ত কর্মী। <nav style="margin-top:8px"><a href="index.html">হোম</a><a href="worker-dashboard.html">Worker</a><a href="jobs.html">কাজ খুঁজুন</a><a href="employer-profile.html">Employer</a><a href="employer-applications.html">আবেদন দেখুন</a><a href="auth.html">লগইন</a></nav></header><main class="wrap"><h1>Worker Dashboard</h1><p class="muted">আপনার অ্যাকাউন্ট UID-এর সঙ্গে যুক্ত; অন্য কেউ আপনার ফোন নম্বর দিয়ে প্রোফাইলে ঢুকতে পারবে না।</p><div id="msg" class="msg"></div><section class="card"><h2>আমার প্রোফাইল</h2><form id="profileForm"><label>পূর্ণ নাম</label><input id="name" required maxlength="100"><label>ফোন নম্বর</label><input id="phone" maxlength="25" placeholder="01XXXXXXXXX"><label>দক্ষতা</label><input id="skills" maxlength="300" placeholder="যেমন: ইলেকট্রিশিয়ান, ডেলিভারি"><label>অভিজ্ঞতা</label><textarea id="experience" rows="3" maxlength="1000"></textarea><label>কাজের এলাকা</label><input id="area" maxlength="150" placeholder="বগুড়া"><button type="submit">প্রোফাইল সংরক্ষণ</button></form></section><section class="card"><h2>আমার আবেদন</h2><div id="apps" class="muted">লোড হচ্ছে…</div></section><button class="secondary" id="logout">লগআউট</button></main><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getDatabase,ref,get,set,update,push,query,orderByChild,equalTo} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig = {
 apiKey: "AIzaSyDUgBWJZ_-61qoifMqiuVaXHULtF1Dma2I",
 authDomain: "workculvert-web.firebaseapp.com",
 databaseURL: "https://workculvert-web-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "workculvert-web",
 storageBucket: "workculvert-web.firebasestorage.app",
 messagingSenderId: "968194354431",
 appId: "1:968194354431:web:20192af00dceee43a830ca"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
const say=(s,ok=false)=>{if($('msg')){$('msg').textContent=s;$('msg').style.color=ok?'#047857':'#b91c1c';}};
async function userRole(user){const s=await get(ref(db,'users/'+user.uid));return s.exists()?s.val().role:null;}
function doLogout(){signOut(auth).then(()=>location.href='auth.html');}

let current;
onAuthStateChanged(auth,async u=>{if(!u){location.replace('auth.html');return;}try{current=u;const role=await userRole(u);if(role!=='worker'){say('এই পেজটি Worker অ্যাকাউন্টের জন্য।');await signOut(auth);location.replace('auth.html');return;}
const s=await get(ref(db,'workers/'+u.uid));if(s.exists()){const d=s.val();['name','phone','skills','experience','area'].forEach(k=>$(k).value=d[k]||'');}
const all=await get(ref(db,'applications'));let rows=[];if(all.exists())all.forEach(jobSnap=>{const v=jobSnap.val();if(v&&v[u.uid])rows.push({jobId:jobSnap.key,...v[u.uid]});});$('apps').innerHTML=rows.length?rows.map(a=>`<div class="item">Job: ${String(a.jobId)} · Status: ${String(a.status||'submitted')}</div>`).join(''):'এখনো কোনো আবেদন পাওয়া যায়নি।';}catch(e){say('ডেটা লোড হয়নি। Firebase Rules ও সংযোগ পরীক্ষা করুন। '+e.message);}});
$('profileForm').addEventListener('submit',async e=>{e.preventDefault();if(!current)return;try{const d={uid:current.uid,email:current.email||'',name:$('name').value.trim(),phone:$('phone').value.trim(),skills:$('skills').value.trim(),experience:$('experience').value.trim(),area:$('area').value.trim(),updatedAt:Date.now()};await update(ref(db,'workers/'+current.uid),d);await update(ref(db,'users/'+current.uid),{displayName:d.name});say('প্রোফাইল সংরক্ষিত হয়েছে।',true);}catch(e){say('সংরক্ষণ হয়নি। Rules মাইগ্রেশন প্রয়োজন হতে পারে। '+e.message);}});
$('logout').addEventListener('click',doLogout);
</script></body></html>
